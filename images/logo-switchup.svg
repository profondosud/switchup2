<svg viewBox="0 0 1448 1086" xmlns="http://www.w3.org/2000/svg" width="1448" height="1086">
  <!-- Logo SWITCH UP - Freccia neon giallo-verde geometrica -->

  <!-- Freccia a tre punte stilizzata - giallo neon #ADDE00 -->
  <g id="switch-arrow">
    <!-- Triangolo sinistro (punta sinistra) -->
    <polygon points="800,400 950,550 950,250" fill="#ADDE00"/>

    <!-- Triangolo destro in alto (punta destra-alto) -->
    <polygon points="950,250 1100,350 1000,200" fill="#ADDE00"/>

    <!-- Triangolo destro in basso (punta destra-basso) -->
    <polygon points="950,550 1100,650 1050,750" fill="#ADDE00"/>
  </g>
</svg>