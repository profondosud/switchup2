<svg viewBox="0 0 1448 1086" xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" preserveAspectRatio="xMidYMid meet">
  <!-- Sfondo trasparente - logo SWITCH UP con freccia neon -->

  <!-- Freccia geometrica giallo-neon (#ADDE00) - stilizzata come nell'originale -->
